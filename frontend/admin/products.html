<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management — ShopEasy Admin</title>
  <meta name="description" content="Manage ShopEasy catalog products, inventory stock, and pricing.">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="admin-shell">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" aria-label="Admin Navigation">
      <div class="admin-sidebar-header">
        <a href="dashboard.html" class="admin-brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:20px;height:20px;color:var(--color-primary);">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>ShopEasy</span>
        </a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="admin-sidebar-nav">
        <a href="dashboard.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          <span>Dashboard</span>
        </a>

        <a href="products.html" class="admin-nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <span>Products</span>
        </a>

        <a href="orders.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span>Orders</span>
        </a>

        <a href="customers.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Customers</span>
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="../index.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Return to Store</span>
        </a>

        <button type="button" class="admin-nav-item" onclick="adminLogout()" style="width:100%;text-align:left;background:none;border:none;cursor:pointer;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main-wrap">
      <!-- Topbar -->
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <button type="button" class="admin-mobile-toggle" aria-label="Toggle navigation drawer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <span class="admin-topbar-title">Catalog &amp; Inventory</span>
        </div>

        <div class="admin-topbar-right">
          <a href="product-form.html" class="btn btn-primary btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add Product
          </a>
          <div class="admin-user-chip">
            <span class="admin-user-avatar">A</span>
            <span>Admin</span>
          </div>
        </div>
      </header>

      <!-- Page Body -->
      <main class="admin-body">
        <div class="admin-toolbar">
          <div class="admin-toolbar-left">
            <div class="admin-search-wrap">
              <svg class="admin-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input 
                type="search" 
                id="admin-product-search" 
                class="admin-search-input" 
                placeholder="Search products by title or ID..." 
                aria-label="Search catalog products"
              >
            </div>

            <select id="admin-category-filter" class="admin-filter-select" aria-label="Filter by category">
              <option value="all">All Categories</option>
              <option value="electronics">Electronics</option>
              <option value="fashion">Fashion</option>
              <option value="accessories">Accessories</option>
              <option value="home">Home &amp; Living</option>
              <option value="beauty">Beauty</option>
            </select>
          </div>

          <div style="font-size:var(--text-xs);color:var(--color-muted);" id="admin-products-count">
            Loading products...
          </div>
        </div>

        <!-- Products Table Card -->
        <div class="admin-card">
          <div class="admin-table-wrap">
            <table class="admin-table" aria-label="Catalog Products Table">
              <thead>
                <tr>
                  <th>Product Details</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock Status</th>
                  <th>Visibility</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody id="admin-products-table-body">
                <!-- Rendered dynamically by admin.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="admin-footer">
        <div class="container">
          <p>&copy; 2026 ShopEasy Inc. Administration Console Prototype.</p>
        </div>
      </footer>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAdminProductsPage();
    });
  </script>
</body>
</html>
