<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag — ShopEasy</title>
  <meta name="description" content="Review items in your shopping bag, adjust quantities, and proceed to checkout.">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="ShopEasy Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>ShopEasy</span>
      </a>

      <nav class="nav-links" aria-label="Primary Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link">Shop</a>
        <a href="index.html#categories" class="nav-link">Categories</a>
        <a href="orders.html" class="nav-link">Orders</a>
      </nav>

      <div class="nav-actions">
        <a href="products.html" class="nav-icon-btn" title="Search catalog" aria-label="Search catalog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </a>

        <a href="profile.html" class="nav-icon-btn" title="Customer Account" aria-label="Customer Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>

        <a href="cart.html" class="nav-icon-btn" title="Shopping Cart" aria-label="Shopping Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" style="display:none;">0</span>
        </a>

        <button type="button" class="mobile-nav-toggle" aria-label="Toggle menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Drawer Menu -->
    <div class="mobile-nav-drawer" aria-label="Mobile Navigation">
      <a href="index.html" class="mobile-nav-link">Home</a>
      <a href="products.html" class="mobile-nav-link">Shop Catalog</a>
      <a href="orders.html" class="mobile-nav-link">My Orders</a>
      <a href="profile.html" class="mobile-nav-link">Customer Profile</a>
      <a href="cart.html" class="mobile-nav-link active">Shopping Bag</a>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="cart-section">
        <header style="margin-bottom:var(--space-8);">
          <h1 style="font-size:var(--text-3xl);font-weight:700;letter-spacing:-0.025em;margin-bottom:var(--space-2);">Your Bag</h1>
          <p style="color:var(--color-muted);font-size:var(--text-base);">Items in your bag are saved in local storage for your review.</p>
        </header>

        <!-- Cart content rendered dynamically by cart.js -->
        <div id="cart-content-container">
          <!-- Populated by cart.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p class="footer-disclaimer">
          &copy; 2026 ShopEasy Inc. Shopping cart prototype with localStorage persistence.
        </p>
        <div style="display:flex;gap:var(--space-4);">
          <span style="color:var(--color-muted);">Currency: INR (₹)</span>
          <a href="products.html" style="color:var(--color-primary);">Continue Shopping</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderCartPage();
    });
  </script>
</body>
</html>
