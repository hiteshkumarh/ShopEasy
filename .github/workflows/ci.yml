name: ShopEasy CI

"on":
  push:
    branches:
      - feature/arya-dual-plan-referral-platform
  pull_request:
    branches:
      - feature/arya-dual-plan-referral-platform
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopeasy_test_ci
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot || exit 1" --health-interval=5s --health-timeout=3s --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Wait for MySQL 8 readiness
        run: |
          for i in {1..30}; do
            if python -c "import socket; s = socket.socket(); s.connect(('127.0.0.1', 3306)); s.close()" 2>/dev/null; then
              echo "MySQL 8 service is up and accepting connections on 127.0.0.1:3306."
              exit 0
            fi
            echo "Waiting for MySQL 8 service container to become healthy ($i/30)..."
            sleep 1
          done
          echo "ERROR: Timed out waiting for MySQL service container."
          exit 1

      - name: Run Python compilation check
        run: |
          python -m compileall -q backend

      - name: Run fast unit tests
        run: |
          cd backend
          python -m pytest -m unit -v

      - name: Run MySQL integration tests
        env:
          TEST_MYSQL_URL: mysql+pymysql://root:root@127.0.0.1:3306/shopeasy_test_ci
        run: |
          cd backend
          python -m pytest -m mysql -v --tb=short --junitxml=junit-mysql.xml
          python -c "import xml.etree.ElementTree as ET, sys; root = ET.parse('junit-mysql.xml').getroot(); suite = root if root.tag == 'testsuite' else root.find('testsuite'); tests = int(suite.attrib.get('tests', 0)); skipped = int(suite.attrib.get('skipped', 0)); failures = int(suite.attrib.get('failures', 0)); errors = int(suite.attrib.get('errors', 0)); print(f'MySQL Integration Tests: {tests} executed, {skipped} skipped, {failures} failed, {errors} errored'); sys.exit(1 if tests == 0 or skipped > 0 or failures > 0 or errors > 0 else 0)"

      - name: Run complete test regression suite
        env:
          TEST_MYSQL_URL: mysql+pymysql://root:root@127.0.0.1:3306/shopeasy_test_ci
        run: |
          cd backend
          python -m pytest -v

      - name: Validate Alembic migrations against isolated CI MySQL
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/shopeasy_test_ci
          ENVIRONMENT: testing
          DB_SSL_CA: ""
        run: |
          cd backend
          alembic upgrade head
          alembic check
